<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2412"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9dff20" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <circle cx="200" cy="150" r="130" fill="#9dff20" opacity=".07"/>

  <!-- megaphone -->
  <g transform="translate(70 92)">
    <path d="M30 40h40l110-52v172L70 108H30a16 16 0 0 1-16-16V56a16 16 0 0 1 16-16z" fill="#9dff20" fill-opacity=".16" stroke="#9dff20" stroke-width="3" stroke-linejoin="round"/>
    <rect x="166" y="-14" width="26" height="176" rx="13" fill="#9dff20" filter="url(#glow)"/>
    <path d="M44 108l14 54a10 10 0 0 0 10 8h14a8 8 0 0 0 8-10l-12-52" fill="#0b1a10" stroke="#9dff20" stroke-width="3" stroke-linejoin="round"/>
    <path d="M216 34a50 50 0 0 1 0 80M236 14a80 80 0 0 1 0 120" stroke="#9dff20" stroke-width="4" stroke-linecap="round" opacity=".8"/>
  </g>

  <!-- ad card -->
  <g transform="translate(360 40)">
    <rect width="190" height="196" rx="14" fill="#06120a" stroke="#9dff20" stroke-opacity=".55" stroke-width="2"/>
    <circle cx="24" cy="24" r="10" fill="#9dff20"/>
    <rect x="42" y="16" width="70" height="8" rx="4" fill="#e7f3ea" opacity=".7"/>
    <rect x="42" y="28" width="40" height="6" rx="3" fill="#e7f3ea" opacity=".3"/>
    <rect x="14" y="46" width="162" height="86" rx="10" fill="#9dff20" fill-opacity=".14"/>
    <path d="M24 122l40-38 28 24 22-16 52 30z" fill="#9dff20" opacity=".75"/>
    <circle cx="140" cy="72" r="12" fill="#c9ff7a" opacity=".8"/>
    <rect x="14" y="144" width="100" height="9" rx="4.5" fill="#e7f3ea" opacity=".45"/>
    <rect x="14" y="164" width="162" height="20" rx="10" fill="#9dff20"/>
    <rect x="62" y="171" width="66" height="6" rx="3" fill="#061104" opacity=".7"/>
  </g>

  <!-- target + click -->
  <g transform="translate(560 248)">
    <circle r="44" stroke="#9dff20" stroke-width="3" opacity=".35"/>
    <circle r="28" stroke="#9dff20" stroke-width="3" opacity=".65"/>
    <circle r="12" fill="#9dff20" filter="url(#glow)"/>
  </g>
  <path d="M566 254l0 34 9-9 8 17 7-3-8-16 13 0z" fill="#e7f3ea" stroke="#061104" stroke-width="2" stroke-linejoin="round"/>

  <!-- CTR badge -->
  <g transform="translate(330 250)">
    <rect width="150" height="44" rx="12" fill="#0b1a10" stroke="#9dff20" stroke-width="2"/>
    <rect x="14" y="26" width="8" height="8" rx="2" fill="#9dff20" opacity=".4"/>
    <rect x="26" y="20" width="8" height="14" rx="2" fill="#9dff20" opacity=".6"/>
    <rect x="38" y="12" width="8" height="22" rx="2" fill="#9dff20"/>
    <text x="58" y="29" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="15" fill="#e7f3ea">A/B ✓</text>
  </g>
</svg>
