<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2412"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9dff20" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <circle cx="330" cy="150" r="150" fill="#9dff20" opacity=".06"/>

  <!-- layers panel -->
  <g transform="translate(46 54)">
    <rect width="120" height="212" rx="14" fill="#06120a" stroke="#9dff20" stroke-opacity=".45" stroke-width="2"/>
    <rect x="14" y="16" width="50" height="8" rx="4" fill="#e7f3ea" opacity=".5"/>
    <rect x="12" y="40" width="96" height="26" rx="7" fill="#9dff20" fill-opacity=".2" stroke="#9dff20" stroke-opacity=".7"/>
    <rect x="22" y="49" width="10" height="10" rx="2" fill="#9dff20"/>
    <rect x="40" y="51" width="50" height="6" rx="3" fill="#e7f3ea" opacity=".8"/>
    <rect x="22" y="80" width="10" height="10" rx="5" fill="#e7f3ea" opacity=".4"/>
    <rect x="40" y="82" width="56" height="6" rx="3" fill="#e7f3ea" opacity=".35"/>
    <rect x="22" y="104" width="10" height="10" rx="2" fill="#e7f3ea" opacity=".4"/>
    <rect x="40" y="106" width="44" height="6" rx="3" fill="#e7f3ea" opacity=".35"/>
    <rect x="22" y="128" width="10" height="10" rx="2" fill="#e7f3ea" opacity=".4"/>
    <rect x="40" y="130" width="52" height="6" rx="3" fill="#e7f3ea" opacity=".35"/>
    <circle cx="30" cy="180" r="10" fill="#9dff20"/>
    <circle cx="56" cy="180" r="10" fill="#c9ff7a"/>
    <circle cx="82" cy="180" r="10" fill="#1f4d0a" stroke="#9dff20"/>
  </g>

  <!-- artboard -->
  <g transform="translate(196 40)">
    <rect width="250" height="240" rx="6" fill="#0b1a10" stroke="#9dff20" stroke-width="2" stroke-dasharray="6 6"/>
    <text x="0" y="-10" font-family="ui-monospace, Menlo, monospace" font-size="12" fill="#9dff20" opacity=".8">Poster 1080×1080</text>
    <rect x="22" y="22" width="206" height="196" rx="10" fill="#9dff20" fill-opacity=".1"/>
    <circle cx="170" cy="78" r="38" fill="#9dff20" opacity=".85"/>
    <rect x="40" y="130" width="120" height="16" rx="4" fill="#e7f3ea" opacity=".9"/>
    <rect x="40" y="154" width="90" height="16" rx="4" fill="#9dff20"/>
    <rect x="40" y="184" width="60" height="18" rx="9" fill="#e7f3ea" opacity=".35"/>
    <!-- bezier curve with handles -->
    <path d="M40 106C70 40 110 120 150 60" stroke="#c9ff7a" stroke-width="3" stroke-linecap="round" filter="url(#glow)"/>
    <path d="M40 106L70 40M150 60L110 120" stroke="#e7f3ea" stroke-opacity=".5" stroke-width="1.5"/>
    <rect x="34" y="100" width="12" height="12" fill="#061104" stroke="#9dff20" stroke-width="2"/>
    <rect x="144" y="54" width="12" height="12" fill="#061104" stroke="#9dff20" stroke-width="2"/>
    <circle cx="70" cy="40" r="5" fill="#e7f3ea"/>
    <circle cx="110" cy="120" r="5" fill="#e7f3ea"/>
  </g>

  <!-- pen tool -->
  <g transform="translate(520 150) rotate(-35)" filter="url(#glow)">
    <path d="M0-70l26 44-10 64h-32l-10-64z" fill="#9dff20"/>
    <path d="M0-70v52" stroke="#061104" stroke-width="3"/>
    <circle cx="0" cy="-14" r="6" fill="#061104"/>
    <rect x="-18" y="40" width="36" height="34" rx="6" fill="#1f4d0a" stroke="#9dff20" stroke-width="3"/>
  </g>

  <!-- color picker chip -->
  <g transform="translate(470 238)">
    <rect width="132" height="40" rx="12" fill="#0b1a10" stroke="#9dff20" stroke-width="2"/>
    <rect x="10" y="10" width="20" height="20" rx="5" fill="#9dff20"/>
    <text x="40" y="26" font-family="ui-monospace, Menlo, monospace" font-size="14" font-weight="700" fill="#e7f3ea">#9DFF20</text>
  </g>
</svg>
