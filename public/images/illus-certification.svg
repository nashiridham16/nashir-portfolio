<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2412"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9dff20" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <circle cx="320" cy="160" r="150" fill="#9dff20" opacity=".06"/>

  <!-- stacked certificates -->
  <rect x="168" y="70" width="280" height="190" rx="12" fill="#06120a" stroke="#9dff20" stroke-opacity=".25" stroke-width="2" transform="rotate(-6 308 165)"/>
  <rect x="180" y="62" width="280" height="190" rx="12" fill="#06120a" stroke="#9dff20" stroke-opacity=".4" stroke-width="2" transform="rotate(-2 320 157)"/>
  <g transform="translate(190 56)">
    <rect width="280" height="190" rx="12" fill="#0b1a10" stroke="#9dff20" stroke-width="2"/>
    <rect x="12" y="12" width="256" height="166" rx="8" stroke="#9dff20" stroke-opacity=".35" stroke-dasharray="4 5"/>
    <rect x="84" y="30" width="112" height="10" rx="5" fill="#9dff20" opacity=".7"/>
    <rect x="60" y="54" width="160" height="16" rx="5" fill="#e7f3ea" opacity=".9"/>
    <rect x="96" y="80" width="88" height="8" rx="4" fill="#e7f3ea" opacity=".35"/>
    <rect x="70" y="96" width="140" height="8" rx="4" fill="#e7f3ea" opacity=".35"/>
    <path d="M40 150c10-14 22 8 34-6s20 4 30-4" stroke="#c9ff7a" stroke-width="3" stroke-linecap="round"/>
    <rect x="36" y="160" width="70" height="3" rx="1.5" fill="#e7f3ea" opacity=".3"/>
  </g>

  <!-- badge with ribbons -->
  <g transform="translate(450 200)">
    <path d="M-24 18l-14 52 22-10 12 20 10-44zM24 18l14 52-22-10-12 20-10-44z" fill="#5cc400"/>
    <circle r="44" fill="#9dff20" filter="url(#glow)"/>
    <circle r="32" stroke="#061104" stroke-width="3" stroke-dasharray="3 5"/>
    <path d="M-16 0l11 11 22-22" stroke="#061104" stroke-width="7" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- chips -->
  <g transform="translate(60 92)">
    <rect width="104" height="36" rx="10" fill="#0b1a10" stroke="#9dff20" stroke-opacity=".6" stroke-width="2"/>
    <text x="52" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#9dff20">BNSP</text>
  </g>
  <g transform="translate(46 144)">
    <rect width="118" height="36" rx="10" fill="#0b1a10" stroke="#9dff20" stroke-opacity=".6" stroke-width="2"/>
    <text x="59" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#e7f3ea">Google Ads</text>
  </g>
  <g transform="translate(70 196)">
    <rect width="94" height="36" rx="10" fill="#0b1a10" stroke="#9dff20" stroke-opacity=".6" stroke-width="2"/>
    <text x="47" y="23" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700" fill="#e7f3ea">TOEFL</text>
  </g>
</svg>
