<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2412"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <linearGradient id="area" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#9dff20" stop-opacity=".45"/>
      <stop offset="1" stop-color="#9dff20" stop-opacity="0"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9dff20" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <circle cx="160" cy="250" r="140" fill="#9dff20" opacity=".06"/>

  <!-- search bar -->
  <g transform="translate(60 38)">
    <rect width="330" height="46" rx="23" fill="#0b1a10" stroke="#9dff20" stroke-width="2"/>
    <circle cx="28" cy="23" r="9" stroke="#9dff20" stroke-width="3"/>
    <path d="M35 30l8 8" stroke="#9dff20" stroke-width="3" stroke-linecap="round"/>
    <rect x="56" y="17" width="150" height="12" rx="6" fill="#e7f3ea" opacity=".75"/>
    <rect x="212" y="15" width="3" height="16" fill="#9dff20"/>
    <rect x="262" y="9" width="58" height="28" rx="14" fill="#9dff20"/>
    <path d="M281 23h20m-6-6 6 6-6 6" stroke="#061104" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- results -->
  <g transform="translate(60 104)">
    <rect width="330" height="56" rx="12" fill="#9dff20" fill-opacity=".14" stroke="#9dff20" stroke-width="2"/>
    <rect x="16" y="14" width="60" height="8" rx="4" fill="#9dff20" opacity=".7"/>
    <rect x="16" y="30" width="180" height="12" rx="6" fill="#e7f3ea" opacity=".9"/>
    <g transform="translate(290 28)" filter="url(#glow)">
      <circle r="20" fill="#9dff20"/>
      <text x="0" y="6" text-anchor="middle" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="16" fill="#061104">#1</text>
    </g>
    <rect y="72" width="330" height="44" rx="12" fill="#e7f3ea" fill-opacity=".04" stroke="#e7f3ea" stroke-opacity=".12"/>
    <rect x="16" y="84" width="50" height="7" rx="3.5" fill="#e7f3ea" opacity=".25"/>
    <rect x="16" y="98" width="150" height="9" rx="4.5" fill="#e7f3ea" opacity=".35"/>
    <rect y="128" width="330" height="44" rx="12" fill="#e7f3ea" fill-opacity=".04" stroke="#e7f3ea" stroke-opacity=".12"/>
    <rect x="16" y="140" width="50" height="7" rx="3.5" fill="#e7f3ea" opacity=".25"/>
    <rect x="16" y="154" width="120" height="9" rx="4.5" fill="#e7f3ea" opacity=".35"/>
  </g>

  <!-- traffic chart -->
  <g transform="translate(420 60)">
    <rect width="170" height="210" rx="14" fill="#06120a" stroke="#9dff20" stroke-opacity=".55" stroke-width="2"/>
    <rect x="16" y="18" width="70" height="8" rx="4" fill="#e7f3ea" opacity=".4"/>
    <text x="16" y="56" font-family="ui-monospace, Menlo, monospace" font-weight="700" font-size="24" fill="#9dff20">+50%</text>
    <path d="M16 186h138M16 156h138M16 126h138" stroke="#e7f3ea" stroke-opacity=".08"/>
    <path d="M16 180l26-12 22 6 24-28 22 8 22-36 22-32V196H16z" fill="url(#area)"/>
    <path d="M16 180l26-12 22 6 24-28 22 8 22-36 22-32" stroke="#9dff20" stroke-width="3" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <circle cx="154" cy="86" r="6" fill="#9dff20" filter="url(#glow)"/>
    <path d="M128 84l26-26m0 0h-16m16 0v16" stroke="#c9ff7a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>
  </g>
</svg>
