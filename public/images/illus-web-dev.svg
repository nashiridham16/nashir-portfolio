<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 320" fill="none">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d2412"/>
      <stop offset="1" stop-color="#030805"/>
    </linearGradient>
    <pattern id="dots" width="20" height="20" patternUnits="userSpaceOnUse">
      <circle cx="1.5" cy="1.5" r="1.5" fill="#9dff20" opacity=".12"/>
    </pattern>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="640" height="320" fill="url(#bg)"/>
  <rect width="640" height="320" fill="url(#dots)"/>
  <circle cx="470" cy="70" r="120" fill="#9dff20" opacity=".08"/>

  <!-- browser window -->
  <g transform="translate(70 46)">
    <rect width="320" height="226" rx="14" fill="#0b1a10" stroke="#9dff20" stroke-opacity=".55" stroke-width="2"/>
    <path d="M0 14a14 14 0 0 1 14-14h292a14 14 0 0 1 14 14v18H0z" fill="#9dff20" fill-opacity=".1"/>
    <circle cx="18" cy="16" r="5" fill="#9dff20"/>
    <circle cx="34" cy="16" r="5" fill="#9dff20" opacity=".55"/>
    <circle cx="50" cy="16" r="5" fill="#9dff20" opacity=".25"/>
    <rect x="70" y="9" width="200" height="14" rx="7" fill="#9dff20" opacity=".14"/>
    <!-- hero block -->
    <rect x="20" y="50" width="150" height="14" rx="4" fill="#e7f3ea" opacity=".85"/>
    <rect x="20" y="72" width="110" height="14" rx="4" fill="#9dff20"/>
    <rect x="20" y="98" width="140" height="7" rx="3.5" fill="#e7f3ea" opacity=".3"/>
    <rect x="20" y="111" width="120" height="7" rx="3.5" fill="#e7f3ea" opacity=".3"/>
    <rect x="20" y="130" width="70" height="22" rx="11" fill="#9dff20"/>
    <rect x="190" y="48" width="110" height="104" rx="10" fill="#9dff20" fill-opacity=".14" stroke="#9dff20" stroke-opacity=".5"/>
    <circle cx="245" cy="90" r="22" fill="#9dff20" opacity=".55"/>
    <path d="M200 145l30-28 22 18 18-12 22 22z" fill="#9dff20" opacity=".8"/>
    <!-- cards -->
    <rect x="20" y="168" width="86" height="40" rx="8" fill="#9dff20" fill-opacity=".1" stroke="#9dff20" stroke-opacity=".35"/>
    <rect x="117" y="168" width="86" height="40" rx="8" fill="#9dff20" fill-opacity=".1" stroke="#9dff20" stroke-opacity=".35"/>
    <rect x="214" y="168" width="86" height="40" rx="8" fill="#9dff20" fill-opacity=".1" stroke="#9dff20" stroke-opacity=".35"/>
  </g>

  <!-- code panel -->
  <g transform="translate(330 120)">
    <rect width="250" height="160" rx="14" fill="#06120a" stroke="#9dff20" stroke-width="2"/>
    <g font-family="ui-monospace, Menlo, monospace" font-size="13" fill="#5f7a67">
      <text x="16" y="34">1</text><text x="16" y="58">2</text><text x="16" y="82">3</text><text x="16" y="106">4</text><text x="16" y="130">5</text>
    </g>
    <rect x="40" y="24" width="56" height="10" rx="5" fill="#67e8f9" opacity=".85"/>
    <rect x="102" y="24" width="80" height="10" rx="5" fill="#e7f3ea" opacity=".7"/>
    <rect x="56" y="48" width="44" height="10" rx="5" fill="#f9a8d4" opacity=".85"/>
    <rect x="106" y="48" width="96" height="10" rx="5" fill="#9dff20"/>
    <rect x="56" y="72" width="64" height="10" rx="5" fill="#f9a8d4" opacity=".85"/>
    <rect x="126" y="72" width="60" height="10" rx="5" fill="#9dff20"/>
    <rect x="56" y="96" width="38" height="10" rx="5" fill="#f9a8d4" opacity=".85"/>
    <rect x="100" y="96" width="30" height="10" rx="5" fill="#fcd34d" opacity=".9"/>
    <rect x="40" y="120" width="20" height="10" rx="5" fill="#e7f3ea" opacity=".7"/>
    <rect x="66" y="118" width="8" height="14" fill="#9dff20" filter="url(#glow)"/>
  </g>

  <!-- tag badge -->
  <g transform="translate(548 70)" filter="url(#glow)">
    <circle r="34" fill="#9dff20"/>
    <path d="M-14-10l-10 10 10 10M14-10l10 10-10 10M5-16l-10 32" stroke="#061104" stroke-width="5" stroke-linecap="round" stroke-linejoin="round"/>
  </g>

  <!-- cursor -->
  <path d="M300 200l0 36 10-10 8 18 8-4-8-17 14 0z" fill="#e7f3ea" stroke="#061104" stroke-width="2" stroke-linejoin="round"/>
</svg>
